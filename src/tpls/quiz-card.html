<label class="quiz-card">
  <input class="quiz-card__input" type="radio" name="@@name" value="@@label">
  <span class="quiz-card__check" aria-hidden="true"></span>
  <span class="quiz-card__label">@@label</span>
  <span class="quiz-card__media">
    <picture class="quiz-card__media-pic">
      <img class="quiz-card__media-img" src="@img/quiz.irt/@@image" alt="" loading="lazy">
    </picture>
  </span>
</label>
